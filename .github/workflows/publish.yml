name: publish

# A published release, not a tag. A tag pushed by mistake can be deleted; a
# release is a deliberate act.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    uses: janbalitaan/pipeline-templates/.github/workflows/python-publish.yml@main
    permissions:
      contents: read
      # A reusable workflow cannot grant itself more than the caller has, so
      # the OIDC permission that trusted publishing needs is granted here.
      id-token: write
    with:
      environment: pypi
