[project]
name = "maskvault"
version = "0.1.0"
description = "Reversible anonymization with a vault: replace confidential values with tokens, pass them through anything, restore them afterwards"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "janbalitaan" }]
keywords = ["anonymization", "pseudonymization", "pii", "privacy", "redaction",
            "secrets", "gdpr", "masking", "tokenization", "data-protection", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Database",
  "Topic :: System :: Logging",
  "Topic :: Text Processing :: Filters",
  "Typing :: Typed",
]
# No dependencies. A privacy filter that pulls in a dependency tree is a
# privacy filter nobody can audit.
dependencies = []

[project.optional-dependencies]
# For encrypting a vault before it is stored. Optional because the common
# case — anonymize, call a provider, restore, all in one request — never
# stores a vault at all, and a privacy filter that pulls in a dependency tree
# is one nobody can audit.
encryption = ["cryptography>=43.0"]

[project.scripts]
maskvault = "maskvault.cli:run"

[project.urls]
Homepage = "https://github.com/janbalitaan/maskvault"
Documentation = "https://github.com/janbalitaan/maskvault#readme"
Source = "https://github.com/janbalitaan/maskvault"
Changelog = "https://github.com/janbalitaan/maskvault/blob/main/CHANGELOG.md"
Issues = "https://github.com/janbalitaan/maskvault/issues"

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "complexipy>=8.1", "ruff>=0.8", "ty>=0.0.1a1"]

[tool.ruff]
line-length = 96
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "PTH",
          "RET", "ARG", "PL", "RUF", "S", "D"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR2004", "ARG", "D"]
# Examples are illustrative scripts, with the same exemptions as the tests
# and for the same reason: they demonstrate rather than implement.
"examples/*" = ["S", "D", "T201", "INP001"]
# S608 flags SQL built by interpolation, and it is right that this file does
# it: a table name and a parameter marker cannot be bound parameters, so both
# are interpolated. Both are also validated first — the table against
# `^[A-Za-z_][A-Za-z0-9_]*$`, the marker against a two-element set — and every
# *value* is bound. tests/stores/test_database_store.py pins the refusals.
"src/maskvault/stores/database.py" = ["S608"]
# A public constructor with five independent keyword-only options is clearer
# than one taking a config object, and the argument count rule does not
# distinguish the two.
"src/maskvault/anonymizer.py" = ["PLR0913"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["maskvault"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/maskvault"]
branch = true
# Runs at import, so it only executes in the subprocess that tests
# `python -m maskvault` — where this process cannot measure it. The test
# asserting it works is in tests/cli/test_policy_and_entry_points.py.
omit = ["src/maskvault/__main__.py"]

[[tool.ty.overrides]]
# An optional extra, absent unless the encryption extra is installed.
include = ["src/maskvault/ciphers/fernet.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
