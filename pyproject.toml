[project]
name = "maskvault"
version = "0.1.0"
description = "Reversible anonymization with a vault: replace confidential values with tokens, pass them through anything, restore them afterwards"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "janbalitaan" }]
keywords = ["anonymization", "pseudonymization", "pii", "privacy", "redaction",
            "secrets", "gdpr", "masking", "tokenization", "data-protection", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Database",
  "Topic :: System :: Logging",
  "Topic :: Text Processing :: Filters",
  "Typing :: Typed",
]
# No dependencies. A privacy filter that pulls in a dependency tree is a
# privacy filter nobody can audit.
dependencies = []

[project.urls]
Homepage = "https://github.com/janbalitaan/maskvault"
Issues = "https://github.com/janbalitaan/maskvault/issues"

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "ty>=0.0.1a1"]

[tool.ruff]
line-length = 96
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "PTH",
          "RET", "ARG", "PL", "RUF", "S", "D"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR2004", "ARG", "D"]
# A public constructor with five independent keyword-only options is clearer
# than one taking a config object, and the argument count rule does not
# distinguish the two.
"src/maskvault/anonymizer.py" = ["PLR0913"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["maskvault"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/maskvault"]
branch = true
